[package]
name = "ai-context-studio-registry"
version = "0.1.0"
edition = "2021"
description = "Registry crate for AI Context Studio - handles asset indexing, search, and catalog management"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
semver = "1.0"