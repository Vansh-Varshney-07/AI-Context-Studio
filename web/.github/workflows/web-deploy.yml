name: Web CI/CD

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"

env:
  NODE_VERSION: "20"
  WORKING_DIR: "./web"

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check DATABASE_URL
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "WARNING: DATABASE_URL secret is not set! Using dummy URL for Prisma generate."
            echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" >> $GITHUB_ENV
          else
            echo "DATABASE_URL is set"
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          fi

      - name: Generate Prisma Client
        run: |
          echo "=== Generating Prisma Client ==="
          npx prisma generate
          echo "=== Generated Client Files ==="
          ls -la node_modules/.prisma/client/
          echo "=== Checking for GeneratedFile type ==="
          grep -r "GeneratedFile" node_modules/.prisma/client/index.d.ts | head -5 || echo "GeneratedFile NOT FOUND in types"
          echo "=== Checking for AnnouncementType enum ==="
          grep -r "AnnouncementType" node_modules/.prisma/client/index.d.ts | head -3 || echo "AnnouncementType NOT FOUND in types"
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify Prisma Schema
        run: npx prisma validate

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ env.WORKING_DIR }}/out
          retention-days: 7

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == "pull_request"
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ./out

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_TOKEN != "" && secrets.VERCEL_ORG_ID != "" && secrets.VERCEL_PROJECT_ID != "" }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod=false"
          working-directory: ./out

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == "push" && github.ref == "refs/heads/main"
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ./out

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_TOKEN != "" && secrets.VERCEL_ORG_ID != "" && secrets.VERCEL_PROJECT_ID != "" }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./out
