[package]
name = "ai-context-studio"
version = "1.0.0"
description = "AI Context Studio - Local-first AI instruction engineering workspace"
authors = ["AI Context Studio"]
license = "MIT"
repository = "https://github.com/Vansh-Varshney-07/AI-Context-Studio"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", features = ["deflate"] }
sha2 = "0.10"
semver = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
dirs = "6"
lazy_static = "1.4"
urlencoding = "2.1"
opener = "0.6"
tokio = { version = "1", features = ["sync"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
